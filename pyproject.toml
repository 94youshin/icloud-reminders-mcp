[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icloud-reminders-mcp"
version = "0.3.1"
description = "A cross-platform MCP server for Apple Reminders powered by pyicloud"
requires-python = ">=3.10"
dependencies = [
  "mcp==1.29.0",
  "pyicloud[cli]==2.6.5",
  "tzdata==2025.2; platform_system == 'Windows'",
]

[project.scripts]
icloud-reminders-mcp = "icloud_reminders_mcp.server:main"

[project.urls]
Repository = "https://github.com/94youshin/icloud-reminders-mcp"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_reminders_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
